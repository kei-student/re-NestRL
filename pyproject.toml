[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "re-nestrl"
version = "0.1.0"
description = "Independent, evidence-tracked reconstruction of NestRL (arXiv:2602.17737v2)"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4", "torch==2.15.0"]

[project.scripts]
nestrl = "nestrl_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
